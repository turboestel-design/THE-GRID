<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE GRID</title>
<style>
:root{--blood:#8a1c14;--bone:#b8ad98;--ink:#0a0807;box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#000;font-family:"Courier New",Courier,monospace}
canvas{display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.85) 100%)}
#grain{position:fixed;inset:-50%;pointer-events:none;opacity:.14;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");animation:g .6s steps(6) infinite}
@keyframes g{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-4%)}60%{transform:translate(-4%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
#hint{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);color:var(--bone);opacity:.4;font-size:12px;letter-spacing:1px;pointer-events:none}
#joy{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:110px;height:110px;border-radius:50%;border:2px solid #3a2a25;background:rgba(0,0,0,.35);display:none;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#3a1512}
#pauseBtn{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border:2px solid #3a2a25;background:#120e0c;color:var(--bone);font:16px "Courier New",monospace;display:none}
#jumpBtn{position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:72px;height:72px;border:2px solid #3a2a25;background:rgba(18,14,12,.7);color:var(--bone);font:12px "Courier New",monospace;letter-spacing:2px;display:none;touch-action:none}
@media (pointer:coarse){#joy,#pauseBtn,#jumpBtn{display:block}}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.82)}
#menu.hidden{display:none}
.board{position:relative;width:min(340px,86vw);box-sizing:border-box;padding:28px 26px 24px;text-align:left;color:var(--bone);transform:rotate(-.8deg);border:3px solid #050302;
  background:
   linear-gradient(90deg,transparent 0 31%,rgba(0,0,0,.55) 31% 31.6%,transparent 31.6% 68%,rgba(0,0,0,.5) 68% 68.5%,transparent 68.5%),
   repeating-linear-gradient(0deg,#2b1d14 0 61px,#080504 61px 64px,#33231a 64px 118px,#080504 118px 121px,#271a12 121px 190px,#080504 190px 193px);
  box-shadow:inset 0 0 40px rgba(0,0,0,.8),0 0 0 1px #1a120d}
.board:before,.board:after{content:"";position:absolute;top:10px;width:6px;height:6px;background:#0c0908;box-shadow:0 0 0 1px #4a3a2e}
.board:before{left:10px}.board:after{right:10px}
.board h1{margin:6px 0 4px;font-size:34px;letter-spacing:6px;font-weight:700;color:var(--blood);text-shadow:2px 2px 0 #000;text-transform:uppercase}
.board .sub{margin:0 0 20px;font-size:12px;letter-spacing:2px;opacity:.55}
.board button{display:block;width:100%;margin:8px 0;padding:11px 12px;text-align:left;font:inherit;font-size:16px;letter-spacing:3px;text-transform:uppercase;color:var(--bone);background:#0d0907;border:2px solid #000;border-left:6px solid #3a1512;cursor:pointer;border-radius:0}
.board button:hover,.board button:focus-visible{color:#d8c9b0;border-left-color:var(--blood);outline:none;background:#150d0a}
.board label{display:block;margin:18px 0 6px;font-size:12px;letter-spacing:2px;opacity:.7}
.board input[type=range]{width:100%;accent-color:#8a1c14}
.board p{margin:16px 0 0;font-size:11px;letter-spacing:1px;opacity:.45}
#prompt{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);display:none;z-index:5;padding:10px 16px;background:rgba(0,0,0,.65);color:var(--bone);border:2px solid #3a2a25;border-left:6px solid var(--blood);font:14px "Courier New",monospace;letter-spacing:3px;border-radius:0;cursor:pointer}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:6;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 30%,rgba(140,10,5,.85) 100%)}
#fade{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;display:flex;align-items:center;justify-content:center;font:700 34px "Courier New",monospace;letter-spacing:8px}
#stats{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);color:var(--bone);opacity:.8;font-size:14px;letter-spacing:2px;pointer-events:none;text-shadow:0 1px 4px #000}
#msg{position:fixed;left:50%;top:18%;transform:translateX(-50%);width:90%;color:var(--bone);font-size:16px;letter-spacing:3px;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s;text-shadow:0 2px 6px #000;z-index:5}
#cross{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;background:rgba(220,210,190,.55);pointer-events:none;display:none}
#fireBtn{position:fixed;right:108px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:72px;height:72px;border:2px solid #3a2a25;background:rgba(60,12,10,.7);color:var(--bone);font:12px "Courier New",monospace;letter-spacing:2px;display:none;touch-action:none}
#hint{text-shadow:0 1px 4px #000}
#ammoBox{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:none;padding:8px 12px 10px;background:rgba(0,0,0,.6);border:2px solid #3a2a25;border-left:6px solid var(--blood);color:var(--bone);pointer-events:none;text-shadow:0 1px 3px #000;z-index:4}
@media (pointer:coarse){#ammoBox{bottom:calc(env(safe-area-inset-bottom,0px) + 128px)}}
#ammoLabel{font-size:10px;letter-spacing:3px;opacity:.6}
#ammoNum{font-size:36px;font-weight:700;letter-spacing:2px;line-height:1.1}
#ammoNum.low{color:#c4281c}
#ammoRow{display:flex;gap:3px;margin-top:6px;max-width:122px;flex-wrap:wrap}
#ammoRow span{display:block;width:5px;height:14px;background:#c9a24a;box-shadow:inset -1px 0 0 rgba(0,0,0,.35)}
#ammoRow span.spent{background:#2a2420;opacity:.55}
#bossBar{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);width:min(340px,60vw);display:none;pointer-events:none;z-index:4}
#bossName{text-align:center;color:var(--bone);font-size:12px;letter-spacing:5px;margin-bottom:4px;text-shadow:0 1px 4px #000}
#bossTrack{position:relative;height:12px;background:rgba(0,0,0,.7);border:2px solid #3a2a25}
#bossGhost,#bossFill,#bossSeg{position:absolute;left:0;top:0;bottom:0}
#bossGhost{background:#d8c9b0;width:100%}
#bossFill{background:#8a1c14;width:100%}
#bossSeg{right:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 2px),#000 calc(12.5% - 2px),#000 12.5%)}
#swapBtn{position:fixed;right:192px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:72px;height:72px;border:2px solid #3a2a25;background:rgba(18,14,12,.7);color:var(--bone);font:12px "Courier New",monospace;letter-spacing:2px;display:none;touch-action:none}
#ammoRow{max-width:150px}
#obj{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 38px);display:none;align-items:center;gap:8px;color:var(--bone);font-size:12px;letter-spacing:2px;opacity:.85;pointer-events:none;text-shadow:0 1px 4px #000;z-index:4}
#objArrow{display:inline-block;font-size:18px;color:#c9a24a}
#cross.hit{width:14px;height:14px;margin:-7px;background:transparent;border:2px solid #e84a3a}
#cross.hit.head{border-color:#ffd36b}
body.nograin #grain{display:none !important}
.board{max-height:92vh;overflow-y:auto}
.board label.chk{display:flex;align-items:center;gap:8px;margin:10px 0 0;opacity:.85}
.board input[type=checkbox]{accent-color:#8a1c14;width:16px;height:16px;margin:0}
#warp button{margin:6px 0}
:root{--hud:1;--touch:1;--xh:5px;--xhc:#ddd5c4}
#stats,#obj,#msg,#ammoBox,#hint,#prompt,#bossBar,#cap{zoom:var(--hud)}
#joy,#fireBtn,#jumpBtn,#swapBtn,#pauseBtn{zoom:var(--touch)}
#cross{width:var(--xh);height:var(--xh);margin:calc(var(--xh)/-2);background:var(--xhc)}
body.xh-plus #cross{background:linear-gradient(var(--xhc),var(--xhc)) center/100% 2px no-repeat,linear-gradient(var(--xhc),var(--xhc)) center/2px 100% no-repeat}
body.xh-ring #cross{background:transparent;border:2px solid var(--xhc);border-radius:50%;box-sizing:border-box}
#cap{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);padding:4px 12px;background:rgba(0,0,0,.7);color:var(--bone);font-size:13px;letter-spacing:2px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:7}
#fps{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);display:none;color:var(--bone);font-size:12px;letter-spacing:2px;text-shadow:0 1px 3px #000;pointer-events:none}
body.hide-msg #msg,body.hide-hint #hint,body.hide-obj #obj,body.hide-stats #stats,body.hide-stats #ammoBox,body.hide-boss #bossBar,body.hide-prompt #prompt,body.hide-fade #fade,body.novig #vig,body.noxh #cross,body.notext #msg,body.notext #hint,body.notext #obj,body.notext #prompt,body.notext #cap,body.notext #bossName,body.notext #ammoLabel,body.notext #stats{display:none !important}
body.notext #fade{color:transparent !important}
body.lefty #joy{left:auto;right:24px}
body.lefty #jumpBtn{right:auto;left:24px}
body.lefty #fireBtn{right:auto;left:108px}
body.lefty #swapBtn{right:auto;left:192px}
.board details{margin:10px 0 0;border-top:1px solid rgba(0,0,0,.5)}
.board summary{cursor:pointer;font-size:12px;letter-spacing:3px;padding:8px 0;opacity:.9;text-transform:uppercase}
.board select{width:100%;background:#0d0907;color:var(--bone);border:2px solid #000;border-left:6px solid #3a2a25;padding:6px;font:inherit;font-size:13px;border-radius:0}
</style>
</head>
<body>
<div id="vig"></div><div id="grain"></div>
<div id="hint">WASD MOVE · SHIFT RUN · SPACE JUMP · E USE · CLICK SHOOT · Q / 1-3 WEAPON · ESC PAUSE</div>
<div id="joy"><div id="knob"></div></div>
<button id="pauseBtn" aria-label="Pause">II</button>
<button id="jumpBtn" aria-label="Jump">JUMP</button>
<div id="hurt"></div><div id="fade"></div><div id="stats"></div><div id="msg"></div><div id="cross"></div>
<div id="cap"></div><div id="fps"></div>
<div id="obj"><span id="objArrow">▲</span><span id="objText"></span></div>
<div id="ammoBox"><div id="ammoLabel">ROUNDS</div><div id="ammoNum">0</div><div id="ammoRow"></div></div>
<div id="bossBar"><div id="bossName">THE TALL MAN</div><div id="bossTrack"><div id="bossGhost"></div><div id="bossFill"></div><div id="bossSeg"></div></div></div>
<button id="fireBtn" aria-label="Fire">FIRE</button>
<button id="swapBtn" aria-label="Switch weapon">SWAP</button>
<button id="prompt"></button>
<div id="menu"><div class="board">
  <h1 id="menuTitle">The Grid</h1>
  <p class="sub" id="menuSub">DO NOT STOP WALKING</p>
  <button id="resume">Enter</button>
  <label for="sens">LOOK SPEED</label>
  <input type="range" id="sens" min="0.4" max="2.5" step="0.1" value="1">
  <label for="fov">FIELD OF VIEW</label><input type="range" id="fov" min="60" max="100" step="1" value="72">
  <label for="vol">VOLUME</label><input type="range" id="vol" min="0" max="1" step="0.05" value="1">
  <label class="chk"><input type="checkbox" id="invY"> INVERT LOOK</label>
  <label class="chk"><input type="checkbox" id="bobT" checked> HEAD BOB</label>
  <label class="chk"><input type="checkbox" id="grainT" checked> FILM GRAIN</label>
  <div id="settingsBox"></div>
  <div id="warp"></div>
  <button id="fs">Fullscreen</button>
  <button id="reset">Return to start</button>
  <p>P PAUSE · M MUTE · Q SWAP · 1-3 WEAPONS</p>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030605);
scene.fog = new THREE.FogExp2(0x030605, 0.05);
const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 200);
camera.rotation.order = 'YXZ';
scene.add(camera);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0x2a3a44, 0.35); scene.add(ambient);
const moon = new THREE.DirectionalLight(0x6f8fb0, 0.18); moon.position.set(-20, 40, 10); scene.add(moon);

// Flashlight
const torch = new THREE.SpotLight(0xffe2b0, 2.4, 38, 0.5, 0.65, 1.4);
torch.position.set(0.25, -0.2, 0);
torch.target.position.set(0, 0, -5);
camera.add(torch, torch.target);

// Ground: dead grass and mud
const SIZE = 140;
const tc = document.createElement('canvas'); tc.width = tc.height = 256;
const g = tc.getContext('2d');
g.fillStyle = '#0e1a0f'; g.fillRect(0,0,256,256);
for (let i = 0; i < 30; i++) { g.fillStyle = `rgba(30,20,12,${0.15+Math.random()*0.25})`; g.beginPath(); g.arc(Math.random()*256, Math.random()*256, 6+Math.random()*18, 0, 6.3); g.fill(); }
for (let i = 0; i < 2800; i++) {
  const x = Math.random()*256, y = Math.random()*256, l = 4+Math.random()*9, a = (Math.random()-.5)*0.9;
  g.strokeStyle = `rgb(${14+Math.random()*24|0},${28+Math.random()*42|0},${10+Math.random()*16|0})`; g.lineWidth = 1+Math.random();
  g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.sin(a)*l, y-Math.cos(a)*l); g.stroke();
}
const tex = new THREE.CanvasTexture(tc);
tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
tex.repeat.set(SIZE/5, SIZE/5);
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, SIZE), new THREE.MeshStandardMaterial({map:tex, roughness:1, metalness:0}));
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// Dead trees
const treePos = [];
const N_TREES = 280;
const trunkGeo = new THREE.CylinderGeometry(0.18, 0.4, 9, 6); trunkGeo.translate(0, 4.5, 0);
const limbGeo = new THREE.CylinderGeometry(0.03, 0.12, 2.6, 5); limbGeo.translate(0, 1.3, 0);
const barkMat = new THREE.MeshStandardMaterial({color:0x2a1f16, roughness:1, flatShading:true});
const trunks = new THREE.InstancedMesh(trunkGeo, barkMat, N_TREES);
const limbs = new THREE.InstancedMesh(limbGeo, barkMat, N_TREES*4);
trunks.frustumCulled = limbs.frustumCulled = false;
{
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = new THREE.Vector3(), p = new THREE.Vector3();
  let li = 0;
  for (let i = 0; i < N_TREES; i++) {
    let x, z;
    do { x = (Math.random()-.5)*(SIZE-4); z = (Math.random()-.5)*(SIZE-4); } while (Math.hypot(x, z-5) < 7 || (Math.abs(x) < 9 && z > -21 && z < -5));
    const s = 0.8 + Math.random()*0.7;
    treePos.push([x, z, 0.5*s]);
    e.set((Math.random()-.5)*0.1, Math.random()*6.28, (Math.random()-.5)*0.1, 'XYZ');
    q.setFromEuler(e); p.set(x, 0, z); sc.set(s, s, s);
    trunks.setMatrixAt(i, m4.compose(p, q, sc));
    for (let k = 0; k < 4; k++) {
      const h = (3.5 + Math.random()*5.5)*s, ls = s*(0.8 + Math.random()*0.8);
      e.set(0, Math.random()*6.28, 0.7 + Math.random()*0.8, 'YXZ');
      q.setFromEuler(e); p.set(x, h, z); sc.set(ls, ls, ls);
      limbs.setMatrixAt(li++, m4.compose(p, q, sc));
    }
  }
  trunks.instanceMatrix.needsUpdate = limbs.instanceMatrix.needsUpdate = true;
}
scene.add(trunks, limbs);

// ---- Old wooden house ----
function makeWood(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const tones = ['#3b2d21', '#34271d', '#43342a', '#2f241b'];
  for (let i = 0; i < 4; i++) {
    x.fillStyle = tones[i]; x.fillRect(0, i*32, 128, 32);
    for (let k = 0; k < 14; k++) { x.fillStyle = `rgba(${Math.random()<.5?'0,0,0':'120,100,80'},${0.06+Math.random()*0.1})`; x.fillRect(0, i*32 + Math.random()*32, 128, 1); }
    x.fillStyle = '#0c0805'; x.fillRect(0, i*32, 128, 2);
    x.fillStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.ellipse(Math.random()*128, i*32 + 16, 5, 3, 0, 0, 6.3); x.fill();
    x.fillStyle = '#0c0805'; x.fillRect(Math.random()*128, i*32, 2, 32);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
const woodTex = makeWood();
const wallMat = new THREE.MeshStandardMaterial({map: woodTex, roughness: 1});
const roofMat = new THREE.MeshStandardMaterial({color: 0x1b1511, roughness: 1});
function woodBox(parent, w, h, d, mat, x, y, z){
  const geo = new THREE.BoxGeometry(w, h, d), uv = geo.attributes.uv;
  const su = Math.max(w, d)/2, sv = h/2;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i)*su, uv.getY(i)*sv);
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m;
}
const H = 3, Z0 = -9, Z1 = -15;
woodBox(scene, 7.2, H, 0.2, wallMat, 0, H/2, Z1);
woodBox(scene, 0.2, H, 6.2, wallMat, -3.5, H/2, -12);
woodBox(scene, 0.2, H, 6.2, wallMat, 3.5, H/2, -12);
woodBox(scene, 2.95, H, 0.2, wallMat, -2.125, H/2, Z0);
woodBox(scene, 2.95, H, 0.2, wallMat, 2.125, H/2, Z0);
woodBox(scene, 1.3, 0.9, 0.2, wallMat, 0, 2.55, Z0);
// Floor
const floorTex = woodTex.clone(); floorTex.needsUpdate = true; floorTex.repeat.set(3, 3);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(6.8, 5.8), new THREE.MeshStandardMaterial({map: floorTex, color: 0xaaaaaa, roughness: 1}));
floor.rotation.x = -Math.PI/2; floor.position.set(0, 0.02, -12); scene.add(floor);
// Gable roof
[-1, 1].forEach(s => { const r = woodBox(scene, 4.44, 0.12, 6.9, roofMat, s*1.95, 4.07, -12); r.rotation.z = -s*0.5; });
const gs = new THREE.Shape(); gs.moveTo(-3.6, 0); gs.lineTo(3.6, 0); gs.lineTo(0, 2.1); gs.closePath();
const gGeo = new THREE.ExtrudeGeometry(gs, {depth: 0.2, bevelEnabled: false});
[Z0, Z1].forEach(z => { const m = new THREE.Mesh(gGeo, wallMat); m.position.set(0, H, z - 0.1); scene.add(m); });
// Door (hinged on the left, swings inward)
const doorPivot = new THREE.Group(); doorPivot.position.set(-0.65, 0, Z0); scene.add(doorPivot);
woodBox(doorPivot, 1.3, 2.1, 0.07, new THREE.MeshStandardMaterial({map: woodTex, color: 0xb0a090, roughness: 1}), 0.65, 1.05, 0);
const doorKnob = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.14), new THREE.MeshStandardMaterial({color: 0x111111, metalness: 0.6, roughness: 0.6}));
doorKnob.position.set(1.15, 1.05, 0); doorPivot.add(doorKnob);
// Small coffee table
const TX = 0.9, TZ = -12.3;
woodBox(scene, 1.0, 0.06, 0.55, wallMat, TX, 0.45, TZ);
[[-0.44, -0.22], [0.44, -0.22], [-0.44, 0.22], [0.44, 0.22]].forEach(([lx, lz]) => woodBox(scene, 0.06, 0.42, 0.06, wallMat, TX + lx, 0.21, TZ + lz));
// Solid boxes: [minX, minZ, maxX, maxZ]
const solids = [
  [-3.6, -15.1, 3.6, -14.9], [-3.6, -15.1, -3.4, -8.9], [3.4, -15.1, 3.6, -8.9],
  [-3.6, -9.1, -0.65, -8.9], [0.65, -9.1, 3.6, -8.9], [TX-0.5, TZ-0.28, TX+0.5, TZ+0.28]
];
const doorBox = [-0.65, -9.1, 0.65, -8.9];
let doorOpen = false, doorAngle = 0, nearDoor = false, action = null;
const prompt = document.getElementById('prompt');
function insideHouse(){ const p = camera.position; return Math.abs(p.x) < 3.4 && p.z < -9.1 && p.z > -14.9; }
function toggleDoor(){ doorOpen = !doorOpen; squeak(1.5); }
prompt.addEventListener('click', () => { useAction(); prompt.blur(); });
function updateDoor(dt){
  const diff = (doorOpen ? 1.75 : 0) - doorAngle;
  doorAngle += Math.sign(diff) * Math.min(Math.abs(diff), dt*1.2);
  doorPivot.rotation.y = doorAngle;

function sweepNoise(f0, f1, dur, gain){
  if (!ac || !whiteBuf) return;
  const t = ac.currentTime, s = ac.createBufferSource(); s.buffer = whiteBuf; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);

  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
function sweepTone(f0, f1, dur, gain, type){
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(gain, t + dur*0.5); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}

function shoot(){

  if (!settings.infAmmo) ammo--; shootCd = W.cd; recoil = W.kick; flashT = 0.06; gunshot(cur); rumble(60, 0.4); updateStats();

    if (o.man || o.beast || o.hound || o.boss) hitMark(o.head);
    if (o.man) hurtMan(d); else if (o.beast) hurtBeast(d); else if (o.hound) hurtHound(o.hound, d); else if (o.boss) hurtKing(o.head ? d : d*0.7);

let rain = 0, rainTarget = 0, weatherT = 20, flash = 0, boltT = 3, boltQueue = 0;
function updateWeather(dt){
  if (heaven || realm > 1) { rainMat.opacity = 0; rainMesh.visible = false; if (rainGain) { rainGain.gain.value = 0; windGain.gain.value = 0; } return; }
  rainMesh.visible = settings.rain;
  weatherT -= dt;
  if (weatherT <= 0) {
    const opts = [0, 0.4, 1].filter(v => v !== rainTarget);
    rainTarget = opts[Math.floor(Math.random()*opts.length)];
    weatherT = 35 + Math.random()*40;
  }
  rain += (rainTarget - rain) * Math.min(1, dt*0.25);
  if (rain > 0.7) {
    boltT -= dt;
    if (boltT <= 0) { flash = 1; thunder(0.4 + Math.random()*2.2); boltT = 5 + Math.random()*14; if (Math.random() < 0.5) boltQueue = 0.12; }
  }
  if (boltQueue > 0) { boltQueue -= dt; if (boltQueue <= 0) flash = 0.9; }
  flash = Math.max(0, flash - dt*3.5);
  const fl = flash*flash*(settings.reduceFlash ? 0.25 : 1);
  ambient.intensity = 0.35 + fl*3.2;
  moon.intensity = 0.18 + fl*3.5;
  scene.background.setRGB(0.012 + 0.4*fl, 0.024 + 0.45*fl, 0.02 + 0.55*fl);
  scene.fog.color.copy(scene.background);
  scene.fog.density = 0.05 + rain*0.02;
  if (rainGain) { const m = insideHouse() ? 0.3 : 1; rainGain.gain.value = rain*0.12*m; windGain.gain.value = (0.05 + rain*0.1 + Math.sin(time*0.4)*0.02)*m; }
  rainMat.opacity = Math.min(1, rain*1.2)*0.45*(insideHouse() ? 0 : 1);
  rainGeo.setDrawRange(0, Math.floor(RAIN_N*rain)*2);
  if (rain > 0.02) {
    const pos = rainGeo.attributes.position.array, fall = 26*dt;
    for (let i = 0; i < RAIN_N; i++) {
      const j = i*6;
      pos[j+1] -= fall; pos[j+4] -= fall;
      if (pos[j+1] < 0) { const y = 16 + Math.random()*2; pos[j+1] = y; pos[j+4] = y - 0.6; }
    }
    rainGeo.attributes.position.needsUpdate = true;
    rainMesh.position.set(camera.position.x, 0, camera.position.z);
  }
}
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05) * settings.speed;
  time += dt;
  updateWeather(dt);
  updateDoor(dt);
  // Flashlight flicker: mostly steady, occasional stutters
  if (dip > 0) dip -= dt; else if (Math.random() < dt * 0.25) dip = 0.05 + Math.random()*0.25;
  torch.intensity = (heaven || realm > 1) ? 0 : (dip > 0 && settings.flicker) ? 0.3 + Math.random()*1.2 : 2.3 + Math.sin(time*7)*0.08;
  torch.intensity *= settings.torch;
  if (paused) { renderer.render(scene, camera); return; }
  shootCd = Math.max(0, shootCd - dt); recoil = Math.max(0, recoil - dt*6); hurtFlash = Math.max(0, hurtFlash - dt*1.5);
  hurtEl.style.opacity = Math.max(hurtFlash, (health < 30 && !heaven) ? 0.25 + Math.sin(time*6)*0.1 : 0);
  updateMan(dt); updateHeaven(dt); updateBars(dt); updateBeast(dt); updateRealm2(dt); updatePortals(dt);
  updateHounds(dt); updateKing(dt); updateWorlds(dt); updatePickups(dt);
  if (firing && WEAPONS[cur].auto) shoot();
  updateQoL(dt);
  const rc = settings.recoil ? 1 : 0; gunView.position.z = -0.45 + recoil*0.1*rc; gunView.rotation.x = recoil*0.25*rc;
  muzzle.intensity = flashT > 0 ? 6*(settings.reduceFlash ? 0.3 : 1) : 0; flashT -= dt;
  if (teleporting) { renderer.render(scene, camera); return; }
  if (dead) {
    camera.position.y += (0.35 - camera.position.y)*Math.min(1, dt*3);
    camera.rotation.z += (0.9 - camera.rotation.z)*Math.min(1, dt*3);
    renderer.render(scene, camera); return;
  }

  let fx = (keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0);
  let fz = (keys.KeyW||keys.ArrowUp?1:0) - (keys.KeyS||keys.ArrowDown?1:0);
  if (Math.hypot(joy.x, joy.y) > 0.15) { fx += joy.x; fz -= joy.y; }
  const len = Math.hypot(fx, fz);
  if (len > 1) { fx /= len; fz /= len; }
  const moving = len > 0.01;
  const run = settings.runMode === 'always' ? true : settings.runMode === 'toggle' ? runToggled : !!(keys.ShiftLeft || keys.ShiftRight);
  const speed = (run ? 7 : 3.6) * Math.min(len, 1);

  if (moving) {
    const sy = Math.sin(yaw), cy = Math.cos(yaw);
    const dx = -sy*fz + cy*fx, dz = -cy*fz - sy*fx;
    const lim = SIZE/2 - 0.5, cx0 = heaven ? HX : [0, 0, RX, AX, BX][realm], lm = heaven ? 36 : [lim, lim, 70, 70, 26][realm];
    let nx = Math.max(cx0 - lm, Math.min(cx0 + lm, camera.position.x + dx*speed*dt));
    let nz = Math.max(-lm, Math.min(lm, camera.position.z + dz*speed*dt));
    if (heaven) { nz = Math.max(-27, nz); if (nz < -5) nx = HX + Math.max(-3.1, Math.min(3.1, nx - HX)); }
    else if (realm === 4) { const dx4 = nx - BX, d4 = Math.hypot(dx4, nz); if (d4 > 27) { nx = BX + dx4/d4*27; nz = nz/d4*27; } }
    for (const t of colliders()) {
      const ox = nx - t[0], oz = nz - t[1], r = t[2] + 0.35, d2 = ox*ox + oz*oz;
      if (d2 < r*r) { const d = Math.sqrt(d2) || 0.001; nx = t[0] + ox/d*r; nz = t[1] + oz/d*r; }
    }
    const boxes = realm > 1 ? [] : doorAngle < 0.9 ? solids.concat([doorBox]) : solids;
    for (const b of boxes) {
      const cx = Math.max(b[0], Math.min(nx, b[2])), cz = Math.max(b[1], Math.min(nz, b[3]));
      const ox = nx - cx, oz = nz - cz, d2 = ox*ox + oz*oz, r = 0.32;
      if (d2 < r*r) {
        if (d2 > 1e-6) { const d = Math.sqrt(d2); nx = cx + ox/d*r; nz = cz + oz/d*r; }
        else {
          const l = nx - b[0], rr = b[2] - nx, tp = nz - b[1], bt = b[3] - nz, m = Math.min(l, rr, tp, bt);
          if (m === l) nx = b[0] - r; else if (m === rr) nx = b[2] + r; else if (m === tp) nz = b[1] - r; else nz = b[3] + r;
        }
      }
    }
    camera.position.x = nx; camera.position.z = nz;
    if (jumpH === 0) {
      bobT += dt * speed * 1.9;
      const st = Math.floor(bobT / Math.PI);
      if (st !== lastStep) { lastStep = st; step(run); }
    }
  }
  // Jump
  if (keys.Space && jumpH === 0 && vy === 0) { vy = 5.2; grunt(); }
  if (vy !== 0 || jumpH > 0) {
    vy -= 14*dt; jumpH += vy*dt;
    if (jumpH <= 0) { jumpH = 0; vy = 0; landDip = 0.14; step(true); }
  }
  landDip *= Math.max(0, 1 - dt*9);
  const bobY = (moving && jumpH === 0) ? Math.sin(bobT) * 0.06 * bobScale : Math.sin(time*1.2) * 0.008;
  const groundTarget = heaven ? heavenH(camera.position.x, camera.position.z) : 0;
  camGround += (groundTarget - camGround) * Math.min(1, dt*14);
  camera.position.y = EYE + camGround + jumpH + bobY - landDip;
  camera.rotation.set(pitch, yaw, moving ? Math.sin(bobT*0.5) * 0.008 * bobScale : 0);
  torch.position.x = 0.25 + (moving ? Math.sin(bobT*0.5) * 0.03 : 0);
  renderer.render(scene, camera);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
loop();
initSettings();
restoreProgress();
</script>
