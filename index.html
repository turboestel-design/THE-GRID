<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE GRID</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="vig"></div><div id="grain"></div>
<div id="hint">WASD MOVE · SHIFT RUN · SPACE JUMP · E USE · CLICK SHOOT · Q / 1-3 WEAPON · ESC PAUSE</div>
<div id="joy"><div id="knob"></div></div>
<button id="pauseBtn" aria-label="Pause">II</button>
<button id="jumpBtn" aria-label="Jump">JUMP</button>
<div id="hurt"></div><div id="fade"></div><div id="stats"></div><div id="msg"></div><div id="cross"></div>
<div id="cap"></div><div id="fps"></div>
<div id="obj"><span id="objArrow">▲</span><span id="objText"></span></div>
<div id="ammoBox"><div id="ammoLabel">ROUNDS</div><div id="ammoNum">0</div><div id="ammoRow"></div></div>
<div id="bossBar"><div id="bossName">THE TALL MAN</div><div id="bossTrack"><div id="bossGhost"></div><div id="bossFill"></div><div id="bossSeg"></div></div></div>
<button id="fireBtn" aria-label="Fire">FIRE</button>
<button id="swapBtn" aria-label="Switch weapon">SWAP</button>
<button id="prompt"></button>

<div id="loreCard"><h3></h3><p></p></div>
<div id="forge"><h2>THE FORGE</h2><div class="sh"></div><div id="forgeRows"></div><button class="close" id="forgeClose">CLOSE</button></div>
<div id="endWrap"><div class="card">
  <h1>YOU ESCAPED</h1>
  <div class="sub" id="endSub">THE GRID LETS GO. IT DOES NOT LET GO FOR LONG.</div>
  <div id="endStats"></div>
  <button id="endNext">BEGIN A NEW CYCLE</button>
  <button id="endStay">KEEP WANDERING</button>
</div></div>
<div id="menu"><div class="board">
  <h1 id="menuTitle">The Grid</h1>
  <p class="sub" id="menuSub">DO NOT STOP WALKING</p>
  <button id="resume">Enter</button>
  <label for="sens">LOOK SPEED</label>
  <input type="range" id="sens" min="0.4" max="2.5" step="0.1" value="1">
  <label for="fov">FIELD OF VIEW</label><input type="range" id="fov" min="60" max="100" step="1" value="72">
  <label for="vol">VOLUME</label><input type="range" id="vol" min="0" max="1" step="0.05" value="1">
  <label class="chk"><input type="checkbox" id="invY"> INVERT LOOK</label>
  <label class="chk"><input type="checkbox" id="bobT" checked> HEAD BOB</label>
  <label class="chk"><input type="checkbox" id="grainT" checked> FILM GRAIN</label>
  <div id="settingsBox"></div>
  <div id="warp"></div>
  <button id="fs">Fullscreen</button>
  <button id="reset">Return to start</button>
  <p>P PAUSE · M MUTE · Q SWAP · 1-3 WEAPONS</p>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/00-core.js"></script>
<script src="js/10-forest.js"></script>
<script src="js/15-hud.js"></script>
<script src="js/20-heaven.js"></script>
<script src="js/25-tall-man.js"></script>
<script src="js/30-world-2-glow.js"></script>
<script src="js/35-gun.js"></script>
<script src="js/40-weapons.js"></script>
<script src="js/45-world-3-ash.js"></script>
<script src="js/50-world-4-eclipse.js"></script>
<script src="js/55-pickups.js"></script>
<script src="js/60-enemies.js"></script>
<script src="js/61-shards.js"></script>
<script src="js/62-forge.js"></script>
<script src="js/63-lore.js"></script>
<script src="js/64-interact.js"></script>
<script src="js/70-combat-realms.js"></script>
<script src="js/75-qol.js"></script>
<script src="js/80-settings.js"></script>
<script src="js/85-input.js"></script>
<script src="js/90-audio.js"></script>
<script src="js/95-pause.js"></script>
<script src="js/99-loop.js"></script>
</body>
</html>
